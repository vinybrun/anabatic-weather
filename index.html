<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anabatic Weather</title>
    <meta
      name="description"
      content="Current conditions and a 7-day forecast for any city. Open-Meteo, no API key."
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>"
    />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="eyebrow">Anabatic</p>
        <h1>Weather loft</h1>
        <p class="lede">
          Current conditions and a short forecast. Search a city or use your location.
        </p>
        <form id="search-form" class="search" role="search" autocomplete="off">
          <label class="sr-only" for="city-input">City</label>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="Search a city…"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false"
          />
          <button type="submit">Search</button>
          <button type="button" id="locate-btn" class="ghost" title="Use my location">
            Near me
          </button>
        </form>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        <ul id="recents" class="recents" hidden aria-label="Recent places"></ul>
        <div class="units" role="group" aria-label="Temperature unit">
          <button type="button" id="unit-c" class="unit is-active" aria-pressed="true">°C</button>
          <button type="button" id="unit-f" class="unit" aria-pressed="false">°F</button>
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="current" class="current" hidden>
        <div class="current-head">
          <div>
            <p id="place" class="place"></p>
            <p id="updated" class="updated"></p>
          </div>
        </div>
        <div class="temp-row">
          <span id="icon" class="wx-icon" aria-hidden="true"></span>
          <span id="temp" class="temp"></span>
        </div>
        <p id="summary" class="summary"></p>
        <dl class="stats">
          <div>
            <dt>Feels like</dt>
            <dd id="feels"></dd>
          </div>
          <div>
            <dt>Humidity</dt>
            <dd id="humidity"></dd>
          </div>
          <div>
            <dt>Wind</dt>
            <dd id="wind"></dd>
          </div>
          <div>
            <dt>High / low</dt>
            <dd id="hi-lo"></dd>
          </div>
        </dl>
      </section>

      <section id="forecast" class="forecast" hidden>
        <h2>7-day outlook</h2>
        <ul id="days" class="days"></ul>
      </section>

      <footer class="foot">
        Data from <a href="https://open-meteo.com/">Open-Meteo</a>. No API key required.
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
